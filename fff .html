<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AppStore User</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f1115;
            --bg-card: #181b21;
            --primary: #00ff88; /* Green Glow */
            --accent: #7000ff; /* Purple Glow */
            --danger: #ff004c; /* Red Glow */
            --text-main: #ffffff;
            --text-sub: #a1a1a1;
            --font-head: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-body); padding-bottom: 80px; overflow-x: hidden; }
        
        /* Utility */
        .hide { display: none !important; }
        .flex { display: flex; align-items: center; }
        .center { justify-content: center; }
        .glow-text { text-shadow: 0 0 10px rgba(0,255,136,0.3); }

        /* Header */
        header { padding: 20px; position: sticky; top: 0; background: rgba(15,17,21,0.95); z-index: 100; backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; }
        .logo { font-family: var(--font-head); font-size: 20px; font-weight: 700; color: var(--primary); }
        .header-icons i { font-size: 20px; margin-left: 15px; position: relative; cursor: pointer; }
        
        /* Badge */
        .badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 50%; font-weight: bold; box-shadow: 0 0 5px var(--danger); display: none; }

        /* Search */
        .search-container { padding: 0 20px; margin-bottom: 20px; }
        .search-bar { width: 100%; background: var(--bg-card); border: none; padding: 12px 15px; border-radius: 12px; color: #fff; font-family: var(--font-body); font-size: 14px; display: flex; align-items: center; border: 1px solid #333; }
        .search-bar input { background: transparent; border: none; flex: 1; color: #fff; margin-left: 10px; outline: none; }

        /* Slider (Highlights) */
        .slider-wrapper { padding: 0 20px; margin-bottom: 25px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        .slide-card { display: inline-block; width: 280px; height: 160px; background: linear-gradient(45deg, #1a1a1a, #252525); margin-right: 15px; border-radius: 16px; position: relative; overflow: hidden; vertical-align: top; box-shadow: 0 5px 15px rgba(0,0,0,0.3); border: 1px solid #333; }
        .slide-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .slide-content { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px; background: linear-gradient(to top, #000, transparent); }
        .slide-title { font-family: var(--font-head); font-weight: 700; font-size: 16px; }
        
        /* Categories */
        .cat-scroll { padding: 0 20px; margin-bottom: 20px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .cat-scroll::-webkit-scrollbar { display: none; }
        .cat-pill { display: inline-block; padding: 8px 16px; background: var(--bg-card); border-radius: 20px; margin-right: 10px; font-size: 13px; color: var(--text-sub); border: 1px solid #333; cursor: pointer; transition: 0.3s; }
        .cat-pill.active { background: rgba(0,255,136,0.1); color: var(--primary); border-color: var(--primary); box-shadow: 0 0 10px rgba(0,255,136,0.1); }

        /* App List */
        .section-title { padding: 0 20px; margin-bottom: 15px; font-family: var(--font-head); font-weight: 600; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        .app-grid { display: flex; flex-direction: column; gap: 15px; padding: 0 20px; }
        
        .app-card { background: var(--bg-card); padding: 12px; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #252525; transition: transform 0.1s; }
        .app-card:active { transform: scale(0.98); }
        .app-card-left { display: flex; align-items: center; flex: 1; min-width: 0; margin-right: 10px; }
        .app-icon { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; box-shadow: 0 4px 8px rgba(0,0,0,0.3); flex-shrink: 0; }
        .app-info { margin-left: 15px; flex: 1; min-width: 0; }
        .app-name { font-family: var(--font-head); font-weight: 600; font-size: 15px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .app-meta { font-size: 11px; color: var(--text-sub); display: flex; align-items: center; gap: 8px; }
        .rating-box { color: #FFD700; font-size: 10px; }
        .download-btn-sm { background: rgba(0,255,136,0.1); color: var(--primary); border: none; padding: 8px 18px; border-radius: 20px; font-weight: 600; font-size: 12px; cursor: pointer; flex-shrink: 0; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: rgba(24,27,33,0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #2a2a2a; z-index: 999; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sub); font-size: 10px; gap: 5px; cursor: pointer; transition: 0.3s; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 10px rgba(0,255,136,0.4); }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 2000; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); overflow-y: auto; }
        .modal.open { transform: translateY(0); }
        .modal-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-dark); z-index: 10; }
        .modal-content { padding: 10px 20px 100px 20px; }
        
        .detail-head { display: flex; align-items: flex-start; margin-bottom: 20px; }
        .detail-icon { width: 80px; height: 80px; border-radius: 18px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); object-fit: cover; flex-shrink: 0; }
        .detail-title-box { margin-left: 15px; flex: 1; }
        .detail-name { font-family: var(--font-head); font-size: 20px; font-weight: 700; margin-bottom: 5px; }
        .detail-dev { color: var(--primary); font-size: 12px; font-weight: 600; }
        
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 20px; background: var(--bg-card); padding: 15px; border-radius: 12px; }
        .stat-item { text-align: center; }
        .stat-val { font-weight: 700; font-size: 14px; color: #fff; }
        .stat-lbl { font-size: 10px; color: var(--text-sub); margin-top: 2px; }

        .big-dl-btn { width: 100%; background: var(--primary); color: #000; font-family: var(--font-head); font-weight: 700; border: none; padding: 15px; border-radius: 12px; font-size: 16px; margin-bottom: 25px; box-shadow: 0 5px 20px rgba(0,255,136,0.3); display: flex; justify-content: center; align-items: center; gap: 10px; cursor: pointer; }
        .big-dl-btn:active { transform: scale(0.98); }

        /* App Store Screenshots Slider (Under Install Button) */
        .screenshots-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 25px; scrollbar-width: none; }
        .screenshots-scroll::-webkit-scrollbar { display: none; }
        .screenshot-img { width: 140px; height: 260px; object-fit: cover; border-radius: 12px; border: 1px solid #333; flex-shrink: 0; background: #1a1a1a; }

        .desc-text { color: #ccc; font-size: 13px; line-height: 1.6; margin-bottom: 20px; }
        .tag-pill { display: inline-block; background: #333; padding: 4px 10px; border-radius: 5px; font-size: 10px; margin-right: 5px; margin-bottom: 5px; }

        /* Notification Modal Styles */
        .notif-item { background: var(--bg-card); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 3px solid var(--primary); position: relative; }
        .notif-item.unread { border-left-color: var(--danger); background: rgba(255, 0, 76, 0.05); }
        .notif-title { font-weight: 700; font-size: 14px; margin-bottom: 5px; }
        .notif-msg { font-size: 12px; color: var(--text-sub); line-height: 1.4; }
        .notif-time { font-size: 10px; color: #666; margin-top: 8px; text-align: right; }

    </style>
</head>
<body>

    <!-- Main Home Page -->
    <div id="home-view">
        <header>
            <div class="logo">Play<span style="color:#fff">Store</span></div>
            <div class="header-icons">
                <i class="fa-solid fa-bell" onclick="openNotifications()">
                    <span id="notif-badge" class="badge">0</span>
                </i>
            </div>
        </header>

        <div class="search-container">
            <div class="search-bar">
                <i class="fa-solid fa-search" style="color:#666"></i>
                <input type="text" id="searchInput" placeholder="Search apps & games...">
            </div>
        </div>

        <div id="featured-section">
            <div class="section-title">Featured</div>
            <div class="slider-wrapper" id="featured-slider">
                <!-- Slides Injected Here -->
            </div>
        </div>

        <div class="cat-scroll" id="cat-filters">
            <div class="cat-pill active" onclick="filterApps('All')">All</div>
            <!-- Categories Injected Here -->
        </div>

        <div class="section-title">
            <span id="list-title">Recommended for you</span>
        </div>

        <div class="app-grid" id="app-list">
            <!-- Apps Injected Here -->
            <div style="text-align:center; padding: 20px; color:#666;">Loading...</div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="goHome()">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="openNotifications()">
            <i class="fa-solid fa-bell"></i>
            <span>Updates</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-gamepad"></i>
            <span>Games</span>
        </div>
    </div>

    <!-- App Details Modal -->
    <div id="app-modal" class="modal">
        <div class="modal-header">
            <i class="fa-solid fa-arrow-left" style="font-size:20px; cursor:pointer;" onclick="closeModal('app-modal')"></i>
            <i class="fa-solid fa-share-nodes" style="font-size:20px; cursor:pointer;"></i>
        </div>
        <div class="modal-content">
            
            <div class="detail-head">
                <img id="m-icon" src="" class="detail-icon">
                <div class="detail-title-box">
                    <div id="m-name" class="detail-name">App Name</div>
                    <div id="m-dev" class="detail-dev">v<span id="m-ver">1.0</span></div>
                    <div class="rating-box" style="margin-top:5px; font-size:12px;">
                        <i class="fa-solid fa-star"></i> <span id="m-rate">4.5</span>
                    </div>
                </div>
            </div>

            <div class="stat-row">
                <div class="stat-item">
                    <div id="m-dl" class="stat-val">0</div>
                    <div class="stat-lbl">Downloads</div>
                </div>
                <div class="stat-item">
                    <div id="m-size" class="stat-val">0 MB</div>
                    <div class="stat-lbl">Size</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">Safe</div>
                    <div class="stat-lbl">Verified</div>
                </div>
            </div>

            <button id="dl-btn" class="big-dl-btn">
                <i class="fa-solid fa-download"></i> Install Now
            </button>

            <!-- Play Store style screenshots slider (Below Install Button) -->
            <div class="screenshots-scroll" id="m-screenshots">
                <!-- Screenshots injected dynamically here -->
            </div>

            <div class="section-title">About this app</div>
            <p id="m-desc" class="desc-text"></p>
            
            <div id="m-tags" style="margin-bottom:20px;"></div>
        </div>
    </div>

    <!-- Notifications Modal -->
    <div id="notif-modal" class="modal">
        <div class="modal-header">
            <span style="font-size:18px; font-weight:700;">Inbox</span>
            <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('notif-modal')"></i>
        </div>
        <div class="modal-content" id="notif-list" style="padding-top:10px;">
            <!-- Notifications Injected Here -->
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 🔥 CONFIGURATION
        const firebaseConfig = {
          apiKey: "AIzaSyBCuaPCa8EmShyntt5DKhjAwMCAyjroB08",
          authDomain: "boreal-ellipse-477416-e5.firebaseapp.com",
          databaseURL: "https://boreal-ellipse-477416-e5-default-rtdb.firebaseio.com",
          projectId: "boreal-ellipse-477416-e5",
          storageBucket: "boreal-ellipse-477416-e5.firebasestorage.app",
          messagingSenderId: "257006226725",
          appId: "1:257006226725:web:c11910c3efce9852e91ecc",
          measurementId: "G-ECSJDFCP17"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global State
        let allApps = [];
        let allCats = [];
        let currentCat = 'All';
        let readNotifs = JSON.parse(localStorage.getItem('readNotifs') || '[]');

        // DOM Elements
        const appListEl = document.getElementById('app-list');
        const sliderEl = document.getElementById('featured-slider');
        const catFilterEl = document.getElementById('cat-filters');
        const searchInput = document.getElementById('searchInput');

        // --- FETCH DATA ---
        
        // 1. Fetch Categories
        const catsRef = ref(db, 'categories');
        onValue(catsRef, (snapshot) => {
            const data = snapshot.val();
            allCats = [];
            catFilterEl.innerHTML = `<div class="cat-pill active" onclick="window.filterApps('All')">All</div>`;
            if(data) {
                Object.keys(data).forEach(key => {
                    allCats.push({id: key, ...data[key]});
                    catFilterEl.innerHTML += `<div class="cat-pill" onclick="window.filterApps('${data[key].name}')">${data[key].name}</div>`;
                });
            }
        });

        // 2. Fetch Apps
        const appsRef = ref(db, 'apps');
        onValue(appsRef, (snapshot) => {
            const data = snapshot.val();
            allApps = [];
            sliderEl.innerHTML = '';
            appListEl.innerHTML = '';

            if (data) {
                Object.keys(data).forEach(key => {
                    allApps.push({id: key, ...data[key]});
                });

                // Populate Featured Slider
                const featured = allApps.filter(a => a.featured);
                featured.forEach(app => {
                    sliderEl.innerHTML += `
                        <div class="slide-card" onclick="window.openApp('${app.id}')">
                            <img src="${app.banner || app.icon}" class="slide-img">
                            <div class="slide-content">
                                <div class="slide-title">${app.name}</div>
                            </div>
                        </div>
                    `;
                });

                renderApps(allApps);
            } else {
                appListEl.innerHTML = '<div style="text-align:center; padding:20px;">No apps found.</div>';
            }
        });

        // 3. Fetch Notifications
        const notifRef = ref(db, 'notifications');
        onValue(notifRef, (snapshot) => {
            const data = snapshot.val();
            const list = document.getElementById('notif-list');
            const badge = document.getElementById('notif-badge');
            list.innerHTML = '';
            let unreadCount = 0;

            if(data) {
                const sortedNotifs = Object.keys(data).map(k => ({id:k, ...data[k]})).reverse();
                
                sortedNotifs.forEach(n => {
                    const isRead = readNotifs.includes(n.id);
                    if(!isRead) unreadCount++;

                    list.innerHTML += `
                        <div class="notif-item ${isRead ? '' : 'unread'}">
                            <div class="notif-title">${n.title}</div>
                            <div class="notif-msg">${n.message}</div>
                            <div class="notif-time">${new Date(n.timestamp).toLocaleDateString()}</div>
                        </div>
                    `;
                });
            }

            if(unreadCount > 0) {
                badge.innerText = unreadCount;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }
        });

        // --- LOGIC FUNCTIONS ---

        window.renderApps = (apps) => {
            appListEl.innerHTML = '';
            apps.forEach(app => {
                appListEl.innerHTML += `
                    <div class="app-card" onclick="window.openApp('${app.id}')">
                        <div class="app-card-left">
                            <img src="${app.icon}" class="app-icon">
                            <div class="app-info">
                                <div class="app-name">${app.name}</div>
                                <div class="app-meta">
                                    <span>${app.category}</span> • <span>${app.size}</span>
                                </div>
                                <div class="app-meta" style="margin-top:4px;">
                                    <div class="rating-box"><i class="fa-solid fa-star"></i> ${app.rating}</div>
                                </div>
                            </div>
                        </div>
                        <button class="download-btn-sm">GET</button>
                    </div>
                `;
            });
        };

        window.filterApps = (catName) => {
            currentCat = catName;
            
            document.querySelectorAll('.cat-pill').forEach(el => {
                el.classList.remove('active');
                if(el.innerText === catName) el.classList.add('active');
            });

            if (catName === 'All') {
                renderApps(allApps);
            } else {
                renderApps(allApps.filter(a => a.category === catName));
            }
        };

        // Search Listener
        searchInput.addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allApps.filter(app => app.name.toLowerCase().includes(term));
            renderApps(filtered);
        });

        // Modal Logic
        let currentAppId = null;
        let currentApkUrl = null;

        window.openApp = (id) => {
            const app = allApps.find(a => a.id === id);
            if(!app) return;

            currentAppId = id;
            currentApkUrl = app.apk;

            document.getElementById('m-icon').src = app.icon;
            document.getElementById('m-name').innerText = app.name;
            document.getElementById('m-ver').innerText = app.version;
            document.getElementById('m-rate').innerText = app.rating;
            document.getElementById('m-dl').innerText = app.downloads || 0;
            document.getElementById('m-size').innerText = app.size;
            document.getElementById('m-desc').innerText = app.description;
            
            // Render Scrollable Screenshots (Admin Panel se upload kiye gaye images)
            const screenshotsContainer = document.getElementById('m-screenshots');
            screenshotsContainer.innerHTML = '';
            
            if (app.screenshots && Array.isArray(app.screenshots) && app.screenshots.length > 0) {
                app.screenshots.forEach(imgUrl => {
                    screenshotsContainer.innerHTML += `<img src="${imgUrl}" class="screenshot-img">`;
                });
            } else if (app.screenshots && typeof app.screenshots === 'object') {
                Object.values(app.screenshots).forEach(imgUrl => {
                    screenshotsContainer.innerHTML += `<img src="${imgUrl}" class="screenshot-img">`;
                });
            } else {
                // Fallback icon agar screenshots na ho
                screenshotsContainer.innerHTML = `
                    <img src="${app.icon}" class="screenshot-img">
                    <img src="${app.icon}" class="screenshot-img">
                `;
            }

            // Generate Tags
            const tagsDiv = document.getElementById('m-tags');
            tagsDiv.innerHTML = `<span class="tag-pill">${app.category}</span>`;
            if(app.trending) tagsDiv.innerHTML += `<span class="tag-pill">Trending</span>`;

            document.getElementById('app-modal').classList.add('open');
        };

        window.closeModal = (id) => {
            document.getElementById(id).classList.remove('open');
        };

        // Download Logic
        document.getElementById('dl-btn').addEventListener('click', () => {
            if(!currentAppId || !currentApkUrl) return;

            // Increment Download Counter in Firebase
            const dlRef = ref(db, `apps/${currentAppId}/downloads`);
            runTransaction(dlRef, (currentDl) => {
                return (currentDl || 0) + 1;
            });

            // Add to Local History
            let history = JSON.parse(localStorage.getItem('installedApps') || '[]');
            if(!history.includes(currentAppId)) {
                history.push(currentAppId);
                localStorage.setItem('installedApps', JSON.stringify(history));
            }

            // Trigger Download
            window.location.href = currentApkUrl;
        });

        // Notification Logic
        window.openNotifications = () => {
            document.getElementById('notif-modal').classList.add('open');
            
            const notifRef = ref(db, 'notifications');
            onValue(notifRef, (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    readNotifs = Object.keys(data);
                    localStorage.setItem('readNotifs', JSON.stringify(readNotifs));
                    document.getElementById('notif-badge').style.display = 'none';
                }
            }, {onlyOnce: true});
        };

        window.goHome = () => {
            document.getElementById('home-view').scrollIntoView();
        }

    </script>
</body>
</html>
